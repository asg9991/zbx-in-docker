zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: b6696ad7e3444a6b848a38b04a7fc037
      template: 'DNS Checks'
      name: 'DNS Checks'
      description: |
        “El monitoreo funcional de DNS (resolución de nombres) requiere Zabbix Agent 2.
        Actualmente el cliente utiliza Zabbix Agent clásico, por lo que el control se limita a disponibilidad del servicio TCP 53.
        La validación funcional será incorporada tras la migración a Agent 2.”
      groups:
        - name: Templates/Applications
      items:
        - uuid: 96a0bb4bf76447d9a631dc88605f20a8
          name: 'DNS responde'
          type: ZABBIX_ACTIVE
          key: 'net.dns.record[{HOST.IP},{$DNS.DOMAIN},A]'
          value_type: TEXT
          tags:
            - tag: service
              value: dns
          triggers:
            - uuid: 593cd8d8be614eec8d0bcf17bc899f82
              expression: 'nodata(/DNS Checks/net.dns.record[{HOST.IP},{$DNS.DOMAIN},A],5m)=1'
              name: 'DNS no responde consultas por 5 minutos'
              priority: HIGH
              tags:
                - tag: service
                  value: dns
        - uuid: ae6b321c81db458e9396234f1d2132e8
          name: 'DNS TCP 53 available'
          type: SIMPLE
          key: 'net.tcp.service[tcp,{$DNS.IP},53]'
          value_type: FLOAT
          tags:
            - tag: component
              value: availability
            - tag: service
              value: dns
          triggers:
            - uuid: 7084793e0532472b9469cc3898649a0b
              expression: 'min(/DNS Checks/net.tcp.service[tcp,{$DNS.IP},53],5m)=0'
              name: 'DNS service TCP 53 no está en escucha por 5 minutos'
              priority: HIGH
              tags:
                - tag: service
                  value: dns
        - uuid: cb820c83277d4b1aa4cb29e0e6bad598
          name: 'UDP 53 en escucha'
          type: ZABBIX_ACTIVE
          key: 'net.udp.listen[53]'
          value_type: FLOAT
          trends: '0'
          tags:
            - tag: service
              value: dns
          triggers:
            - uuid: 86f6142a3e114183ab34627af5866ba5
              expression: 'min(/DNS Checks/net.udp.listen[53],5m)=0'
              name: 'Puerto UDP 53 no está en escucha por 5 minutos'
              priority: HIGH
              tags:
                - tag: service
                  value: dns
      macros:
        - macro: '{$DNS.DOMAIN}'
          value: www.google.com
  triggers:
    - uuid: 0cf970333b7843439dc2a97f3198f521
      expression: 'nodata(/DNS Checks/net.dns.record[{HOST.IP},{$DNS.DOMAIN},A],5m)=1 and min(/DNS Checks/net.udp.listen[53],5m)=0'
      name: 'DNS caído (servicio y puerto UDP)'
      priority: HIGH
      tags:
        - tag: service
          value: dns
