              name: 'Interface {#IFNAME}({#IFALIAS}): AP channel'
              type: DEPENDENT
              key: 'ssid.channel[mtxrWlCMChannel.{#SNMPINDEX}]'
              value_type: CHAR
              description: |
                MIB: MIKROTIK-MIB
                mtxrWlCMChannel
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.14988.1.1.1.7.1.5.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: net.if.wireless.walk
              tags:
                - tag: component
                  value: interface
                - tag: component
