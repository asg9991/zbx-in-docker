# Live export of Zabbix template 10870 ('PPP Dedicated Users by SNMP').
# Source: Zabbix 7.4 database (item_preproc / item_condition / item_discovery).
# The 7.4 API does not expose LLD preprocessing, filters or prototypes.
# Template hosts: SW-EDGE-501, SW-EDGE-502, SW-EDGE-602, SW-EDGE-601, SW-EDGE-701, SW-EDGE-702
zabbix_export:
  version: '7.4'
  templates:
    - uuid: 16a2353f628340b288f6b844922bd923
      template: PPP Dedicated Users by SNMP
      name: PPP Dedicated Users by SNMP
      description: |-
        Durable LLD layer for dedicated PPP users (manual per-user items/graphs/
        dashboard live elsewhere and are out of scope for this template).
        
        Discovery on MikroTik active-PPP name column
        .1.3.6.1.4.1.14988.1.1.2.1.1.2 -> {#PPP_NAME}; filter is a
        case-insensitive exact-match whitelist (see {$PPP.DEDICATED.MATCHES}).
        
        Enlace-Soychu covers BOTH soychu and 1-7-1 (same link per user
        confirmation) — no separate 1-7-1 entry by design.
        
        DIRECTION ASSUMPTION (UNCONFIRMED): col .8 is treated as IN (Bits
        received, green 199C0D gradient behind) and col .9 as OUT (Bits sent,
        red F63100 line on top), mirroring the Netflix-style VLAN template.
        If live traffic shows the direction inverted, swap the two OIDs.
        
        Risk: PPP index flap -> LLD re-discovers under the new index and
        history splits at the flap point. One trigger prototype: Bits received
        = 0 sustained 30m (High), effective business hours via maintenance.
      items:
        - uuid: ef8c84effc3f436689c133ca9376697f
          name: 'PPP dedicated: SNMP walk active entries'
          type: SNMP_AGENT
          key: net.ppp.walk
          snmp_oid: 'walk[1.3.6.1.4.1.14988.1.1.2.1.1.2]'
          delay: 5m
          timeout: 10s
          value_type: TEXT
          history: 3d
          description: 'Master walk feeding PPP dedicated-users discovery and 64-bit counters (MikroTik private MIB, numeric OIDs).'
      discovery_rules:
        - uuid: c90cdaa214b74e3da58acb23eee6cf8e
          name: PPP dedicated users discovery
          type: DEPENDENT
          key: net.ppp.discovery
          lifetime: 7d
          description: 'Discovers whitelisted dedicated PPP users only (case-insensitive exact match on {#PPP_NAME}).'
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#PPP_NAME}'
                - 1.3.6.1.4.1.14988.1.1.2.1.1.2
                - '0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: net.ppp.walk
          item_prototypes:
            - uuid: 00f5dfeae9ec4cbfae3e4dd2e8532b03
              name: 'PPP {#PPP_NAME}: Bits received'
              type: SNMP_AGENT
              key: 'net.ppp.in[{#PPP_NAME}]'
              snmp_oid: '1.3.6.1.4.1.14988.1.1.2.1.1.8.{#SNMPINDEX}'
              delay: 1m
              value_type: UNSIGNED
              units: bps
              history: 31d
              trends: 365d
              description: |-
                MikroTik active-PPP col .8 (.1.3.6.1.4.1.14988.1.1.2.1.1.8), Counter64.
                Rate per second x8 = bits per second.
                DIRECTION ASSUMPTION UNCONFIRMED: col .8 treated as IN.
              preprocessing:
                - type: CHANGE_PER_SECOND
                  error_handler: 1
                - type: MULTIPLIER
                  parameters:
                    - '8'
                  error_handler: 1
            - uuid: c308e6a9dd0a46ad917678d683bd5381
              name: 'PPP {#PPP_NAME}: Bits sent'
              type: SNMP_AGENT
              key: 'net.ppp.out[{#PPP_NAME}]'
              snmp_oid: '1.3.6.1.4.1.14988.1.1.2.1.1.9.{#SNMPINDEX}'
              delay: 1m
              value_type: UNSIGNED
              units: bps
              history: 31d
              trends: 365d
              description: |-
                MikroTik active-PPP col .9 (.1.3.6.1.4.1.14988.1.1.2.1.1.9), Counter64.
                Rate per second x8 = bits per second.
                DIRECTION ASSUMPTION UNCONFIRMED: col .9 treated as OUT.
              preprocessing:
                - type: CHANGE_PER_SECOND
                  error_handler: 1
                - type: MULTIPLIER
                  parameters:
                    - '8'
                  error_handler: 1
          filters:
            - macro: '{#PPP_NAME}'
              value: '{$PPP.DEDICATED.MATCHES}'
              op: MATCHES_REGEX
      macros:
        - macro: '{$PPP.DEDICATED.MATCHES}'
          value: '(?i)^(<pppoe-coopvinia>|<pppoe-multijactosa>|<pppoe-franciscosellart>|<pppoe-arrebeef>|<pppoe-garfin>|<pppoe-buratovichhnos>|<pppoe-southernseeds>|<pppoe-patrullarural>|Enlace-patrullarural)$'
          description: 'LLD whitelist PPP dedicados UP 2026-10-10: match exacto case-insensitive sobre {#PPP_NAME}. Cubre variantes garfin/agrosa/laesperanza y buratovich/* + Enlace-patrullarural y futuro <pppoe-patrullarural>.'
