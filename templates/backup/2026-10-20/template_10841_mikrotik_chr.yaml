                - '0'
                - '{#STORAGE_TYPE}'
                - 1.3.6.1.2.1.25.2.3.1.2
                - '0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: vfs.fs.walk
          item_prototypes:
            - uuid: 073679ba825d4499a94b8e6c5bd8e5a0
              name: 'Disk-{#SNMPINDEX}: Space utilization'
              type: CALCULATED
              key: vfs.fs.pused[hrStorageSize.{#SNMPINDEX}]
              delay: 1m
              value_type: FLOAT
              units: '%'
              history: 31d
              trends: 365d
              description: The space utilization expressed in % for Disk-{#SNMPINDEX}.
            - uuid: 72268d36959f45b1b7740f62e9bdf385
              name: 'Disk-{#SNMPINDEX}: Total space'
              type: DEPENDENT
              key: vfs.fs.total[hrStorageSize.{#SNMPINDEX}]
              value_type: UNSIGNED
              units: B
              history: 31d
              trends: 365d
              description: |-
                MIB: HOST-RESOURCES-MIB
                The size of the storage represented by this entry, in
                units of hrStorageAllocationUnits. This object is
                writable to allow remote configuration of the size of
                the storage area in those cases where such an
                operation makes sense and is possible on the
                underlying system. For example, the amount of main
                memory allocated to a buffer pool might be modified or
                the amount of disk space allocated to virtual memory
                might be modified.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - 1.3.6.1.2.1.25.2.3.1.5.{#SNMPINDEX}
                    - '0'
                - type: MULTIPLIER
                  parameters:
                    - '1024'
              master_item:
                key: vfs.fs.walk
            - uuid: 5aacd7049bb74a258b431e3bcafef8d6
              name: 'Disk-{#SNMPINDEX}: Used space'
              type: DEPENDENT
              key: vfs.fs.used[hrStorageSize.{#SNMPINDEX}]
              value_type: UNSIGNED
              units: B
              history: 31d
              trends: 365d
              description: |-
                MIB: HOST-RESOURCES-MIB
                The amount of the storage represented by this entry that is allocated, in units of hrStorageAllocationUnits.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - 1.3.6.1.2.1.25.2.3.1.6.{#SNMPINDEX}
                    - '0'
                - type: MULTIPLIER
                  parameters:
                    - '1024'
              master_item:
                key: vfs.fs.walk
          filters:
            - macro: '{#STORAGE_TYPE}'
              value: .+4$
              op: MATCHES_REGEX
            - macro: '{#STORAGE_TYPE}'
              value: .+hrStorageFixedDisk
              op: MATCHES_REGEX
