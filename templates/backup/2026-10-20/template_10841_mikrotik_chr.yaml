            - macro: '{#IFNAME}'
              value: '{$NET.IF.IFNAME.MATCHES}'
              op: MATCHES_REGEX
            - macro: '{#IFNAME}'
              value: '{$NET.IF.IFNAME.NOT_MATCHES}'
              op: NOT_MATCHES_REGEX
            - macro: '{#IFTYPE}'
