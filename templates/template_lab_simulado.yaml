zabbix_export:
  version: '7.4'
  templates:
    - uuid: ccaea318-aacd-48a6-ba12-943838d8105f
      template: Lab Simulado
      name: Lab Simulado
      description: |
        Dispositivos simulados para el laboratorio del NOC Agent.
        Los datos llegan por trapper (zabbix_sender) desde el contenedor
        del simulador; las ventanas de incidente estan definidas en
        docker/simulator/scenarios.yml. Ver docs/instalacion.md.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 4e47e293-bff3-4ce0-b9f3-cf117a11dcfb
          type: TRAPPER
          name: 'CPU utilizacion (%)'
          key: lab.cpu.util
          value_type: FLOAT
          history: 7d
          trends: 30d
        - uuid: 9d6be88c-f1c0-43ee-be39-dd36a30028ad
          type: TRAPPER
          name: 'Memoria utilizada (%)'
          key: lab.mem.util
          value_type: FLOAT
          history: 7d
          trends: 30d
        - uuid: 5b325e05-6a42-4f7b-bb59-ff6daf2cd6ca
          type: TRAPPER
          name: 'Disco utilizado (%)'
          key: lab.disk.used.pct
          value_type: FLOAT
          history: 7d
          trends: 30d
        - uuid: 7f0d6b32-5477-4c7a-8deb-78987443123e
          type: TRAPPER
          name: 'Perdida de paquetes (%)'
          key: lab.net.packet.loss.pct
          value_type: FLOAT
          history: 7d
          trends: 30d
        - uuid: 56059185-1b1a-4fdf-b222-13a002182cb0
          type: TRAPPER
          name: 'Latencia (ms)'
          key: lab.net.latency.ms
          value_type: FLOAT
          history: 7d
          trends: 30d
        - uuid: e7f18922-3d90-4b0f-a563-ce03b3431123
          type: TRAPPER
          name: 'Estado del link (1=up, 0=down)'
          key: lab.link.status
          value_type: UNSIGNED
          history: 7d
          trends: 30d
          triggers:
            - uuid: c27d54db-dd0d-49c2-b7fc-002603f52c42
              expression: 'last(//lab.link.status)=0'
              recovery_expression: 'last(//lab.link.status)=1'
              name: 'Link caido en equipo simulado'
              event_name: 'Link caido: {HOST.NAME}'
              opdata: 'Estado: {?last(//lab.link.status)}'
              priority: HIGH
              description: 'El link simulado reporta down. Ventana de incidente definida en scenarios.yml.'
      triggers:
        - uuid: e80e2780-466c-4e86-872c-c595e879164d
          expression: 'avg(//lab.cpu.util,3m)>90'
          name: 'CPU alta en equipo simulado (>90%)'
          event_name: 'CPU alta: {ITEM.LASTVALUE1}% en {HOST.NAME}'
          opdata: 'CPU: {?avg(//lab.cpu.util,3m)}%'
          priority: HIGH
          description: 'Promedio de CPU sobre 3m supera el umbral.'
        - uuid: 510432a8-e8ed-413c-985a-65d1db229115
          expression: 'last(//lab.mem.util)>90'
          name: 'Memoria alta en equipo simulado (>90%)'
          event_name: 'Memoria {ITEM.LASTVALUE1}% en {HOST.NAME}'
          opdata: 'MEM: {?last(//lab.mem.util)}%'
          priority: AVERAGE
          description: 'Uso de memoria supera el umbral.'
        - uuid: 99afeba6-7f8f-4240-b6b2-7b3514fd875e
          expression: 'last(//lab.disk.used.pct)>85'
          name: 'Disco casi lleno en equipo simulado (>85%)'
          event_name: 'Disco {ITEM.LASTVALUE1}% en {HOST.NAME}'
          opdata: 'DISCO: {?last(//lab.disk.used.pct)}%'
          priority: AVERAGE
          description: 'Uso de disco supera el umbral. En server-sim-03 es un problema persistente (no se recupera solo).'
        - uuid: 9e89460b-f151-4838-b1cb-4d6eab069c85
          expression: 'avg(//lab.net.packet.loss.pct,3m)>20'
          name: 'Perdida de paquetes en equipo simulado (>20%)'
          event_name: 'Perdida {ITEM.LASTVALUE1}% en {HOST.NAME}'
          opdata: 'PERDIDA: {?avg(//lab.net.packet.loss.pct,3m)}%'
          priority: HIGH
          description: 'Promedio de perdida de paquetes sobre 3m supera el umbral.'
        - uuid: 3c5b2e41-7b9b-4163-a91e-62c4d28435c7
          expression: 'avg(//lab.net.latency.ms,3m)>150'
          name: 'Latencia alta en equipo simulado (>150ms)'
          event_name: 'Latencia {ITEM.LASTVALUE1}ms en {HOST.NAME}'
          opdata: 'LATENCIA: {?avg(//lab.net.latency.ms,3m)}ms'
          priority: WARNING
          description: 'Promedio de latencia sobre 3m supera el umbral.'
