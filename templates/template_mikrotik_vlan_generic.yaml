zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 4258bf24bd70421aa0666313a841af95
      name: 'Templates/Network devices'
  templates:
    - uuid: cd29e4cf03ba4606ba756c09b64d2baf
      template: 'Mikrotik VLAN Generic by SNMP'
      name: 'Mikrotik VLAN Generic by SNMP'
      description: |
        Generic reusable template: discovers MikroTik VLAN interfaces
        (ifDescr == ifName == vlan<ID>, ifAlias empty) and graphs
        64-bit HC In/Out octets as bits per second.

        Numeric OIDs only (poller has no MIBs):
        In  .1.3.6.1.2.1.31.1.1.1.6.<idx>  (ifHCInOctets)
        Out .1.3.6.1.2.1.31.1.1.1.10.<idx> (ifHCOutOctets)

        Discovery filter: {#IFDESCR} matches {$VLAN.IFDESCR.MATCHES}
        (default ^vlan[0-9]+$); pppoe-* excluded via NOT_MATCHES filters.
        Override the macros at host/template level to adjust.
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 6bff5679745847838305e3d43484477a
          name: 'Mikrotik VLAN: SNMP walk VLAN interfaces'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.2.2.1.3,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10]'
          key: net.vlan.walk
          delay: 1m
          history: '0'
          value_type: TEXT
          description: 'Master walk feeding VLAN discovery and 64-bit HC counters (IF-MIB, numeric OIDs).'
          tags:
            - tag: component
              value: raw
      discovery_rules:
        - uuid: da10ef5798234fe09e9ec611ef468ccc
          name: 'VLAN interfaces discovery'
          type: DEPENDENT
          key: net.vlan.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFDESCR}'
                value: '{$VLAN.IFDESCR.MATCHES}'
              - macro: '{#IFDESCR}'
                value: '{$VLAN.IFDESCR.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#IFNAME}'
                value: '{$VLAN.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: 'Discovers VLAN interfaces (ifDescr vlan<ID>); excludes pppoe-* churn.'
          item_prototypes:
            - uuid: b977fe8e6c914ab3a0ab522765cc3e56
              name: 'VLAN {#IFDESCR}: Bits received'
              type: DEPENDENT
              key: 'net.vlan.in[ifHCInOctets.{#SNMPINDEX}]'
              units: bps
              description: |
                IF-MIB ifHCInOctets (.1.3.6.1.2.1.31.1.1.1.6), 64-bit.
                Rate per second x8 = bits per second.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: net.vlan.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFDESCR}'
            - uuid: 381178704a304421b25b064aedd9aa7c
              name: 'VLAN {#IFDESCR}: Bits sent'
              type: DEPENDENT
              key: 'net.vlan.out[ifHCOutOctets.{#SNMPINDEX}]'
              units: bps
              description: |
                IF-MIB ifHCOutOctets (.1.3.6.1.2.1.31.1.1.1.10), 64-bit.
                Rate per second x8 = bits per second.
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
                    - '0'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: net.vlan.walk
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFDESCR}'
              trigger_prototypes:
                - uuid: 40493b3883ad44268df0bc2c6d47db0a
                  expression: 'min(/Mikrotik VLAN Generic by SNMP/net.vlan.out[ifHCOutOctets.{#SNMPINDEX}],5m)=0'
                  name: 'VLAN {#IFDESCR}: No traffic sent for 5m'
                  priority: HIGH
                  description: 'Bits sent stayed at 0 for 5 minutes. Idle VLANs will fire by design — review before linking.'
          graph_prototypes:
            - uuid: 8cc8c851c33c416aa3d98de8adf30e29
              name: 'VLAN {#IFDESCR}: Traffic'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: 'Mikrotik VLAN Generic by SNMP'
                    key: 'net.vlan.in[ifHCInOctets.{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: F63100
                  item:
                    host: 'Mikrotik VLAN Generic by SNMP'
                    key: 'net.vlan.out[ifHCOutOctets.{#SNMPINDEX}]'
          master_item:
            key: net.vlan.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#IFDESCR}'
                - 1.3.6.1.2.1.2.2.1.2
                - '0'
                - '{#IFNAME}'
                - 1.3.6.1.2.1.31.1.1.1.1
                - '0'
                - '{#IFALIAS}'
                - 1.3.6.1.2.1.31.1.1.1.18
                - '0'
                - '{#IFTYPE}'
                - 1.3.6.1.2.1.2.2.1.3
                - '0'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
      tags:
        - tag: class
          value: network
        - tag: target
          value: mikrotik
      macros:
        - macro: '{$VLAN.IFDESCR.MATCHES}'
          value: '^vlan[0-9]+$'
          description: 'LLD include: VLAN interfaces by ifDescr (== ifName == vlan<ID> on MikroTik).'
        - macro: '{$VLAN.IFDESCR.NOT_MATCHES}'
          value: '^pppoe-.*'
          description: 'LLD exclude: pppoe churn by ifDescr.'
        - macro: '{$VLAN.IFNAME.NOT_MATCHES}'
          value: '^pppoe-.*'
          description: 'LLD exclude: pppoe churn by ifName.'
