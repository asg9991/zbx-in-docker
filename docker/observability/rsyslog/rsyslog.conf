# Receptor syslog del colector (ADR 0001, D3).
#
# Este archivo reemplaza el rsyslog.conf de la imagen: no incluye nada de
# /etc/rsyslog.d. El objetivo es un solo trabajo: recibir syslog remoto,
# escribir un archivo diario por sitio y nada mas. Sin reenvio, sin filtros
# propios: el filtrado vive en el clasificador y en Loki.
#
# El archivo es el buffer de disco: si Alloy o Loki caen, se sigue
# escribiendo aca. La retencion (borrado por edad) la hace el contenedor
# rsyslog-retention, no este proceso.

module(load="imudp")
module(load="imtcp")

# Un archivo por dia. Nunca se renombra ni se trunca mientras Alloy lo lee:
# el corte de dia es un archivo nuevo, no un rotate del anterior.
template(name="remoteFile" type="string"
  string="/var/log/remote/%$YEAR%-%$MONTH%-%$DAY%.log")

# Formato estable para que Alloy parsee sin heuristica:
#   ts(from-host)  ip  hostname  facility  severity  tag  msg
template(name="remoteLine" type="string"
  string="%TIMESTAMP:::date-rfc3339% %FROMHOST-IP% %HOSTNAME% %syslogfacility-text% %syslogseverity-text% %syslogtag% %msg%\n")

ruleset(name="remote") {
  action(type="omfile"
         dynaFile="remoteFile"
         template="remoteLine"
         fileCreateMode="0644"
         dirCreateMode="0755"
         dirOwner="root"
         dirGroup="root")
}

input(type="imudp" port="1514" ruleset="remote")
input(type="imtcp" port="1514" ruleset="remote")
