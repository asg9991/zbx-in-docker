# Observabilidad hibrida (ADR 0001): Loki + Grafana + Alloy + rsyslog.
#
# Override opcional: el stack base sigue funcionando sin esto.
#
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml \
#     -f docker-compose.observability.yml --profile observability up -d
#
# Reglas que este archivo respeta (ADR D5, D6):
#   - Loki y Grafana NO publican puertos: viven en la red `backend`.
#   - Unica excepcion publicada: el receptor syslog, en la IP de gestion
#     (SYSLOG_BIND_IP, default 127.0.0.1). Nunca WAN.
#   - Datos persistentes bajo ${DATA_DIR}.
#
# Versiones fijadas en el ADR (§10). No usar `latest`.

name: zbx-in-docker

services:

  # Receptor syslog y buffer de disco. Alloy hace tail de estos archivos.
  # Si Alloy o Loki caen, rsyslog sigue escribiendo: el archivo es el buffer.
  rsyslog:
    profiles: ["observability"]
    image: rsyslog/rsyslog:2026-10
    container_name: zbx-rsyslog
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ./observability/rsyslog/rsyslog.conf:/etc/rsyslog.conf:ro
      - ${DATA_DIR:-/opt/monitoring/data}/rsyslog:/var/log/remote

    ports:
      # IP de gestion solamente. Si el sitio necesita exponerlo a las redes
      # de equipos, SYSLOG_BIND_IP se fija a la IP de esa interfaz.
      - "${SYSLOG_BIND_IP:-127.0.0.1}:${SYSLOG_PORT:-1514}:1514/udp"
      - "${SYSLOG_BIND_IP:-127.0.0.1}:${SYSLOG_PORT:-1514}:1514/tcp"

    # En `frontend`, no en `backend`: Docker NO publica puertos de un
    # contenedor conectado solo a redes `internal`, y este es justamente el
    # unico servicio que tiene que escuchar desde afuera.
    networks:
      - frontend

    healthcheck:
      test: ["CMD-SHELL", "pgrep rsyslogd >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # Retencion del buffer: archivos diarios de rsyslog, se borran por edad.
  # No hay rename ni truncado, asi que Alloy nunca pierde un archivo que
  # esta leyendo. El limite es la edad: si Alloy estuvo caido mas dias que
  # RSYSLOG_RETENTION_DAYS, se pierden lineas (documentado en el ADR).
  rsyslog-retention:
    profiles: ["observability"]
    image: alpine:3.22
    container_name: zbx-rsyslog-retention
    restart: unless-stopped

    # Sin red: solo toca el volumen del buffer.
    network_mode: "none"

    environment:
      RSYSLOG_RETENTION_DAYS: ${RSYSLOG_RETENTION_DAYS:-7}

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          find /var/log/remote -type f -name '*.log' \
            -mtime +"$${RSYSLOG_RETENTION_DAYS}" -delete
          sleep 3600
        done

    volumes:
      - ${DATA_DIR:-/opt/monitoring/data}/rsyslog:/var/log/remote

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.10
    container_name: zbx-loki
    restart: unless-stopped

    command:
      - -config.file=/etc/loki/loki-config.yml
      - -config.expand-env=true

    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-168h}
      LOKI_INGESTION_RATE_MB: ${LOKI_INGESTION_RATE_MB:-4}
      LOKI_INGESTION_BURST_MB: ${LOKI_INGESTION_BURST_MB:-8}
      # Atraso maximo que Loki acepta al recuperarse (sintaxis de Loki).
      LOKI_MAX_BACKLOG: ${LOKI_MAX_BACKLOG:-192h}

    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${DATA_DIR:-/opt/monitoring/data}/loki:/loki

    networks:
      - backend

    # Sin healthcheck: la imagen de Loki 3.x es distroless (no hay shell ni
    # wget). La disponibilidad se observa desde Alloy y desde /ready con un
    # cliente externo (ver README de observability/).

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # Colector: tail de los archivos de rsyslog + logs de contenedor -> Loki.
  # No recibe syslog: eso es rsyslog (ADR D3).
  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.22.0
    container_name: zbx-alloy
    restart: unless-stopped

    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # Necesario para el WAL de loki.write (feature experimental en
      # v1.22.0). Si se desactiva, se pierde la durabilidad ante crash
      # sucio; el buffer de rsyslog sigue cubriendo caidas de Alloy/Loki.
      - --stability.level=experimental
      # Sin reporte de uso a stats.grafana.org: en un sitio de cliente no debe
      # intentar salir a Internet (y evita el warning por minuto en los logs).
      - --disable-reporting

    environment:
      SITE: ${SITE:-lab}

    depends_on:
      - loki
      - rsyslog

    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${DATA_DIR:-/opt/monitoring/data}/alloy:/var/lib/alloy/data
      # Logs de los contenedores del stack (loki.source.docker).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Buffer de rsyslog, solo lectura: Alloy nunca escribe ni borra.
      - ${DATA_DIR:-/opt/monitoring/data}/rsyslog:/var/log/remote:ro

    networks:
      - backend

    # Sin healthcheck: la imagen de Alloy no trae wget/curl. Su
    # `/-/ready` se consulta con un cliente externo (README de
    # observability/).

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  grafana:
    profiles: ["observability"]
    # Imagen propia solo para fijar la version del plugin de Zabbix (ADR D4).
    build:
      context: ./observability/grafana
      # Mismo motivo que los otros builds del repo: la red de build por
      # defecto no resuelve grafana.com en este host.
      network: host
      args:
        ZABBIX_PLUGIN_VERSION: ${ZABBIX_PLUGIN_VERSION:-6.10.3}

    image: lab/grafana-zabbix:13.3.1

    container_name: zbx-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?falta GF_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Plugin horneado fuera de /var/lib/grafana, que se monta desde DATA_DIR.
      GF_PATHS_PLUGINS: /opt/grafana-plugins
      # Sale por nginx en /grafana/ (ADR D5). En un cliente, la URL real del
      # sitio va en su .env; en lab, loopback.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Credenciales del datasource Zabbix (solo lectura).
      GF_ZABBIX_USER: ${GF_ZABBIX_USER:-grafana-ro}
      GF_ZABBIX_PASSWORD: ${GF_ZABBIX_PASSWORD:-}
      # Token de API de Zabbix (solo lectura) para el datasource Infinity.
      ZBX_API_TOKEN: ${ZBX_API_TOKEN:-}

    depends_on:
      - loki

    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${DATA_DIR:-/opt/monitoring/data}/grafana:/var/lib/grafana

    # backend para Loki y zabbix-web; frontend para que nginx la alcance.
    networks:
      - backend
      - frontend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null | grep -q ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # El simulador tambien emite syslog al receptor. Necesita la red
  # `frontend` porque rsyslog vive ahi (es el unico que escucha hacia afuera).
  lab-simulator:
    profiles: ["lab"]
    networks:
      - backend
      - frontend
    environment:
      ZABBIX_SERVER: zabbix-server
      SYSLOG_HOST: rsyslog
      SYSLOG_PORT: "1514"
      # 0 en regimen normal; se sube puntualmente para sembrar historia.
      LAB_BACKFILL_DAYS: ${LAB_BACKFILL_DAYS:-0}
