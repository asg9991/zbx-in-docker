# Nombre de proyecto fijo: el prefijo de redes/contenedores no depende del
# nombre del directorio, asi renombrar la carpeta no duplica el stack.
name: noc-agent

services:

  postgres:
    image: postgres:15
    container_name: zabbix-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ${DATA_DIR:-/opt/monitoring/data}/postgres:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  zabbix-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.zabbix-server
      network: host

    image: lab/zabbix-server:7.4.13
    container_name: zabbix-server
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "10051:10051"

    networks:
      - backend
      - frontend

    volumes:
      - ../scripts:/usr/lib/zabbix/externalscripts:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # Agente del propio lab: atiende los passive checks del host
  # "Zabbix server" (su interfaz apunta al DNS zabbix-agent:10050).
  zabbix-agent:
    # Nota: agent2 no tiene repo "-alpine" en Docker Hub; el tag alpine
    # vive en zabbix/zabbix-agent2.
    image: zabbix/zabbix-agent2:alpine-7.4.13
    container_name: zabbix-agent
    restart: unless-stopped

    environment:
      ZBX_HOSTNAME: "Zabbix server"
      # El entrypoint usa ZBX_SERVER_HOST tanto para checks activos como
      # para el origen permitido de los pasivos. No agregar
      # ZBX_PASSIVESERVERS con el mismo valor: duplica la entrada y agent2
      # rechaza la config ("address specified more than once").
      ZBX_SERVER_HOST: zabbix-server

    depends_on:
      - zabbix-server

    networks:
      - backend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4.13
    container_name: zabbix-web
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${TZ}

    depends_on:
      - zabbix-server

    expose:
      - "8080"

    networks:
      - backend
      - frontend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  nginx:
    image: nginx:alpine
    container_name: monitoring-nginx
    restart: unless-stopped

    depends_on:
      - zabbix-web

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - frontend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  # Solo lab: docker compose --profile lab up -d
  # Alimenta los hosts simulados (trapper) segun docker/simulator/scenarios.yml.
  lab-simulator:
    profiles:
      - "lab"

    build:
      context: ..
      dockerfile: docker/Dockerfile.simulator
      network: host

    image: lab/lab-simulator:latest
    container_name: lab-simulator
    restart: unless-stopped

    depends_on:
      - zabbix-server

    environment:
      ZABBIX_SERVER: zabbix-server

    volumes:
      - ./simulator/scenarios.yml:/etc/lab-sim/scenarios.yml:ro

    networks:
      - backend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


networks:

  # Lab local: subredes explicitas para evitar colisiones con otros
  # proyectos Docker y con redes corporativas (ver docs/instalacion.md).
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.28.90.0/24

  # Gestionada por este compose (antes era externa: monitoring-net),
  # asi el stack es autocontenido y funciona en cualquier host.
  frontend:
    ipam:
      config:
        - subnet: 172.28.91.0/24
