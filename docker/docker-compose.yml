services:

  postgres:
    image: postgres:15
    container_name: zabbix-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - /opt/monitoring/data/postgres:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  zabbix-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.zabbix-server

    image: site-c/zabbix-server:7.0.6
    container_name: zabbix-server
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "10051:10051"

    networks:
      - backend
      - frontend

    volumes:
      - ../scripts:/usr/lib/zabbix/externalscripts:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0.6
    container_name: zabbix-web
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${TZ}

    depends_on:
      - zabbix-server

    expose:
      - "8080"

    networks:
      - backend
      - frontend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  grafana:
    image: grafana/grafana:11.6.1
    container_name: grafana
    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://192.0.2.11/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

    volumes:
      - /opt/monitoring/data/grafana:/var/lib/grafana

    expose:
      - "3000"

    networks:
      - backend
      - frontend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  nginx:
    image: nginx:alpine
    container_name: monitoring-nginx
    restart: unless-stopped

    depends_on:
      - zabbix-web
      - grafana

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - frontend

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


networks:

  backend:
    internal: true

  frontend:
    external: true
    name: monitoring-net
